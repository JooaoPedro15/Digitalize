name: Manter sites acordados

# O plano gratuito do Render desliga o serviço depois de 15 minutos sem acesso,
# e a primeira visita seguinte espera o servidor ligar (cerca de 1 minuto).
# Em horário comercial (segunda a sexta, 8h às 19h de Brasília) os sites são
# acessados a cada 5 minutos para continuarem ligados. Fora desse horário eles
# dormem, o que mantém o uso dentro das 750 horas gratuitas por mês do Render.
on:
  schedule:
    - cron: "*/5 11-21 * * 1-5" # 11h-21h55 UTC = 8h-18h55 em Brasília
  workflow_dispatch:

jobs:
  acessar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://digitalize-vaux.onrender.com/health
          - https://devfinance-szqo.onrender.com/api
    steps:
      - name: Acessar ${{ matrix.url }}
        run: curl --silent --show-error --fail --max-time 120 --retry 2 --output /dev/null "${{ matrix.url }}"
