<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | Digitalize</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/digitalize.css">
  <script type="module" src="js/paginas/admin.js"></script>
</head>
<body>
  <div class="app">
    <aside class="app-menu" id="menu"></aside>
    <main class="app-conteudo">
      <header class="cabecalho-pagina">
        <div>
          <h1>Administração</h1>
          <p>Aprove os negócios que podem aparecer na vitrine pública.</p>
        </div>
      </header>

      <div class="aviso" id="aviso-admin" hidden></div>

      <section class="bloco" aria-labelledby="titulo-empresas">
        <header>
          <h2 id="titulo-empresas">Negócios</h2>
          <div class="acoes" role="group" aria-label="Filtrar por situação" id="filtros">
            <button type="button" class="botao botao-pequeno botao-secundario" data-filtro="todas" aria-pressed="true">Todos</button>
            <button type="button" class="botao botao-pequeno botao-discreto" data-filtro="pendente" aria-pressed="false">Aguardando aprovação</button>
            <button type="button" class="botao botao-pequeno botao-discreto" data-filtro="aprovada" aria-pressed="false">Aprovados</button>
            <button type="button" class="botao botao-pequeno botao-discreto" data-filtro="rejeitada" aria-pressed="false">Rejeitados</button>
          </div>
        </header>
        <div class="tabela-envelope">
          <table>
            <thead><tr><th>Negócio</th><th>CNPJ</th><th>Responsável</th><th>Situação</th><th><span class="oculto-visualmente">Ações</span></th></tr></thead>
            <tbody id="tabela-empresas"></tbody>
          </table>
        </div>
      </section>

      <section class="bloco" aria-labelledby="titulo-usuarios">
        <header><h2 id="titulo-usuarios">Usuários</h2></header>
        <div class="tabela-envelope">
          <table>
            <thead><tr><th>Nome</th><th>Email</th><th>Perfil</th></tr></thead>
            <tbody id="tabela-usuarios"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
