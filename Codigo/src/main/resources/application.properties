spring.application.name=digitalize

# Lê o .env local (raiz do repositório ou pasta Codigo), se existir
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${PORT:8080}

# Banco local por padrão. Em produção, DATABASE_URL (formato do Neon/Render)
# tem prioridade e é tratada em DataSourceConfig.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digitalize}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
spring.datasource.hikari.maximum-pool-size=5

# O schema é criado e versionado pelo Flyway; o Hibernate só confere se as entidades batem
spring.flyway.schemas=digitalize
spring.flyway.default-schema=digitalize
spring.jpa.properties.hibernate.default_schema=digitalize
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

digitalize.demo.ativo=${DIGITALIZE_DEMO:false}
digitalize.admin.email=${DIGITALIZE_ADMIN_EMAIL:}
digitalize.admin.senha=${DIGITALIZE_ADMIN_PASSWORD:}

digitalize.azure-openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
digitalize.azure-openai.api-key=${AZURE_OPENAI_API_KEY:}
digitalize.azure-openai.chat-deployment=${AZURE_OPENAI_CHAT_DEPLOYMENT:}
digitalize.azure-openai.api-version=${AZURE_OPENAI_API_VERSION:2024-10-21}

# Chave de assinatura dos tokens (mínimo 32 caracteres). Sem ela, uma chave temporária é gerada.
digitalize.jwt.segredo=${JWT_SECRET:}
digitalize.jwt.validade-horas=8
